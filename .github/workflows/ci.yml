name: CI Quality Gate & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Code Quality & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Multi-Language Linters
        run: |
          yarn run lint-python
          yarn run lint-scss
          yarn run lint-html

  test-and-audit:
    name: Run Test Suite & Security Audit
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.lock.txt ]; then
            pip install -r requirements.lock.txt
          else
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Dependency Security Audit
        run: |
          if [ -f requirements.lock.txt ]; then
            pip-audit -r requirements.lock.txt
          else
            pip-audit -r requirements.txt
          fi

      - name: Run Pytest Suite with Coverage Gate
        run: pytest --cov=webapp --cov-report=term-missing --cov-fail-under=50
